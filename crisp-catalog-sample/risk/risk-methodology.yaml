# Risk methodology. All values are made up to show the shape. Cyber risk owns the real one.
version: 1
owner: Cyber risk (methodology owner)
purpose: "One approved way to rate risk, so priority and posture are consistent and can be defended."
factors:
  impact:
    inputs: [data_class, criticality]
    combine: highest
    scale: "1 to 4, taken from the attribute scores"
  likelihood:
    inputs: [exposure, threat_context]
    combine: average_rounded_up
    scale: "1 to 4, taken from the attribute scores"
inherent_risk:
  formula: "likelihood x impact"
  range: "1 to 16"
rating_thresholds:
  - {rating: Low,      min: 1,  max: 3}
  - {rating: Medium,   min: 4,  max: 7}
  - {rating: High,     min: 8,  max: 11}
  - {rating: Critical, min: 12, max: 16}
residual_risk:
  formula: "inherent score x status factor, rounded to the nearest whole number, minimum 1"
  status_factors:
    addressed: 0.25
    partly_addressed: 0.6
    gap: 1.0
    not_yet_assessed: 1.0
  risk_accepted: "The status factor of the underlying status still applies. Acceptance is recorded with its decision reference, conditions and expiry date. It does not change the rating."
overrides:
  who: Cyber risk (methodology owner) or delegate
  limit: "Up or down by one rating level."
  downgrade_from_critical: "Also needs governance board approval."
  record: "Original rating, new rating, reason, approver, date."
worked_examples:
  - project: "Payments portal"
    attributes: {data_class: confidential, criticality: high, exposure: internet-authenticated, threat_context: high}
    impact: 3
    likelihood: 3
    inherent: "9 (High)"
    residual: {gap: "9 (High)", partly_addressed: "5 (Medium)", addressed: "2 (Low)"}
  - project: "Internal reporting tool"
    attributes: {data_class: internal, criticality: low, exposure: internal, threat_context: low}
    impact: 2
    likelihood: 1
    inherent: "2 (Low)"
    residual: {gap: "2 (Low)"}
  - project: "Public information site"
    attributes: {data_class: public, criticality: medium, exposure: internet-public, threat_context: elevated}
    impact: 2
    likelihood: 3
    inherent: "6 (Medium)"
    residual: {gap: "6 (Medium)"}
